                    //         .setLngLat([room.lon, room.lat])
                    //         .setPopup(new maplibregl.Popup({offset: 25}).setText(room.name))
                    //         .addTo(map);
                    // }
                }
            })
            map.on('click', (e) => {
                if(roomAdditionMode) {
                    let name = prompt("Please enter room number");
                    if(name == null) {
                        return;
                    }
                    buildings.filter(i=>i.name == editingBuilding)[0].rooms.push({name:name, lat:e.lngLat.lat, lon:e.lngLat.lng});
                    new maplibregl.Marker()
                            .setLngLat(e.lngLat)
                            .setPopup(new maplibregl.Popup({offset: 25}).setText(name))
                            .addTo(map);
                }
            })
            document.getElementById("roomSearch").addEventListener("keydown", (e) => {
                if(e.key == 'Enter') {
                    roomSearch();
                }
            })
            var livePosMarker;
            var accuracyIndicator;
            var headingIndicator;
            var lastAccuracyMeters = 0;
            function success(position) {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                livePosMarker.setLngLat([longitude, latitude]);
                accuracyIndicator = turf.circle([longitude, latitude], position.coords.accuracy, {steps:64, units:'meters'});
                map.getSource('location-radius').setData(accuracyIndicator);
                map.panTo([longitude, latitude]);
                lastAccuracyMeters = position.coords.accuracy;
            }
            function error() {
                console.log("error retreiving location")
            }
            function liveLocate() {
                livePosMarker = new maplibregl.Marker()
                    .setLngLat([0,0])
                    .addTo(map);
                accuracyIndicator = turf.circle([0, 0], 1, {steps:64, units:'meters'});
                // Add the circle as a GeoJSON source
                map.addSource('location-radius', {
                    type: 'geojson',
                    data: accuracyIndicator
                });
                // Add a fill layer with some transparency
                map.addLayer({
                    id: 'location-radius',
                    type: 'fill',
                    source: 'location-radius',
                    paint: {
                        'fill-color': '#8CCFFF',
                        'fill-opacity': 0.5
                    }
                });
                // Add a line layer to draw the circle outline
                map.addLayer({
                    id: 'location-radius-outline',
                    type: 'line',
                    source: 'location-radius',
                    paint: {
                        'line-color': '#0094ff',
                        'line-width': 3
                    }
                });//https://maplibre.org/maplibre-gl-js/docs/examples/draw-a-circle/

                headingIndicator = turf.lineString([[0,0],[0,1]]);
                //now one for the heading
                map.addSource('location-heading', {
                    type: 'geojson',
                    data: headingIndicator
                });
                // Add a line layer to draw the heading
                map.addLayer({
                    id: 'location-heading-outline',
                    type: 'line',
                    source: 'location-heading',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#0094ff',
                        'line-width': 3
                    }
                });
                navigator.geolocation.watchPosition(success, error, {maximumAge: 5000, enableHighAccuracy: true});
                if (window.DeviceOrientationEvent) { //compass
                    DeviceOrientationEvent.requestPermission();
                    window.addEventListener(
                        "deviceorientationabsolute",
                        (event) => {
                            const rotateDegrees = 360-event.alpha; // alpha: rotation around z-axis
                            const leftToRight = event.gamma; // gamma: left to right
                            const frontToBack = event.beta; // beta: front back motion
                            document.getElementById("compass").textContent = rotateDegrees + " deg";
                            // headingIndicator = turf.lineArc(livePosMarker.getLngLat(), lastAccuracyMeters, rotateDegrees-5, rotateDegrees+5, {units:"meters"});
                            // console.log(livePosMarker.getLngLat())
                            let outsidepoint = turf.destination([livePosMarker.getLngLat().lng,livePosMarker.getLngLat().lat], lastAccuracyMeters, rotateDegrees, {units:"meters"});
                            headingIndicator = {'type': 'FeatureCollection','features': [{'type': 'Feature','geometry': {'type': 'LineString','properties': {},'coordinates': [[livePosMarker.getLngLat().lng, livePosMarker.getLngLat().lat], outsidepoint.geometry.coordinates]}}]}
                            // headingIndicator = turf.lineString([[livePosMarker.getLngLat().lng, livePosMarker.getLngLat().lat],turf.destination([livePosMarker.getLngLat().lng,livePosMarker.getLngLat().lat], lastAccuracyMeters, rotateDegrees, {units:"meters"})]);
                            map.getSource('location-heading').setData(headingIndicator);
                        },
                        true,
                    );
                }
            }
            window.liveLocate = liveLocate;
        </script>
    </body>
</html>
