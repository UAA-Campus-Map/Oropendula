    <script>
    var testImage;
    function geoFindMe() {
    const status = document.querySelector("#status");
    const mapLink = document.querySelector("#map-link");

    mapLink.href = "";
    mapLink.textContent = "";
    // testImage = L.imageOverlay(bmh, su2Bounds).addTo(map);


    function success(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        var livelocPixels = mapPosToPixels(referencePointA, referencePointB, {lat: latitude, lon: longitude});
        // ctx.drawImage(image, livelocPixels.x - 100, livelocPixels.y - 100, 200, 200, 0, 0, 1000, 1000);
            // ctx.fillStyle = "#00FF00";
            // ctx.fillRect(livelocPixels.x - 3, livelocPixels.y - 3, 6,6);
        // ctx.fillRect(495,495,10,10);

        status.textContent = "";
        mapLink.href = `https://www.openstreetmap.org/#map=18/${latitude}/${longitude}`;
        mapLink.textContent = `Latitude: ${latitude} °, Longitude: ${longitude} °`;
        marker.setLatLng(new L.LatLng(latitude, longitude));
        accuracyRadius.setLatLng(new L.LatLng(latitude, longitude));
        accuracyRadius.setRadius(position.coords.accuracy);
        map.panTo(new L.LatLng(latitude, longitude));
    }

    updateBuildingLocation = function() {
        testImage.remove();
        var imageUrl = 'https://uaa-campus-map.net/aasc2.png',
            imageBounds = [[+document.getElementById("lata").value, +document.getElementById("lonb").value], [+document.getElementById("latb").value, +document.getElementById("lona").value]];
        testImage = L.imageOverlay(imageUrl, imageBounds).addTo(map);
    }

    function error() {
        status.textContent = "Unable to retrieve your location";
    }

    if (!navigator.geolocation) {
        status.textContent = "Geolocation is not supported by your browser";
    } else {
        status.textContent = "Locating…";
        navigator.geolocation.watchPosition(success, error, {maximumAge: 5000, enableHighAccuracy: true});
    }
    }

    document.querySelector("#find-me").addEventListener("click", geoFindMe);
    </script>
